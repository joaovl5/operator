[project]
  name = "operator-core"
  version = "0.1.0"
  description = "Core bindings for Operator."
  readme = "README.md"
  requires-python = ">=3.14"
  dependencies = [
    "attrs",
    "pydantic",
    "openai",
    "pydantic-ai-slim[openai]",
    "httpx",
    "rich",
  ]

  [project.scripts]
    operator-chat = "operator_core.operator_scripts.interactive:main"

[build-system]
  requires      = ["uv_build>=0.9.8,<0.10.0"]
  build-backend = "uv_build"

[tool.uv.build-backend]
  module-root    = "src"
  source-exclude = ["*.test.py", "tests"]
  wheel-exclude  = ["*.test.py", "tests"]


[tool.alembic]
  script_location = "%(here)s/src/alembic_scripts"
  # additional paths to be prepended to sys.path. defaults to the current working directory.
  prepend_sys_path = [
    ".",
  ]
  [[tool.alembic.post_write_hooks]]
    name    = "ruff_format"
    type    = "module"
    module  = "ruff"
    options = "format REVISION_SCRIPT_FILENAME"
  [[tool.alembic.post_write_hooks]]
    name    = "ruff_check"
    type    = "module"
    module  = "ruff"
    options = "check --fix REVISION_SCRIPT_FILENAME"
