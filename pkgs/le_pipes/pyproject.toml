[project]
  name = "le-pipes"
  version = "0.1.0"
  description = "Functional pipeline library"
  readme = "README.md"
  requires-python = ">=3.14"
  dependencies = [
    "attrs>=26.1.0",
  ]

[build-system]
  requires      = ["uv_build>=0.9.8,<0.10.0"]
  build-backend = "uv_build"

[tool.uv.build-backend]
  module-root    = "src"
  source-exclude = ["*.test.py", "tests"]
  wheel-exclude  = ["*.test.py", "tests"]
