[project]
  name = "operator"
  version = "0.1.0"
  readme = "README.md"
  requires-python = ">=3.14"
  dependencies = [
    "aiofile>=3.9.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "anyio>=4.12.1",
    "fastnanoid>=0.4.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.49",
    "operator-core",
    "operator-cli",
    "advanced-alchemy>=1.11.0",
  ]

[tool.uv.workspace]
  members = ["pkgs/*"]

[tool.uv.sources]
  operator-core = { workspace = true }
  operator-cli  = { workspace = true }

[dependency-groups]
  dev = [
    "advanced-alchemy[cli]>=1.11.0",
    "basedpyright>=1.38.3",
    "ipython>=9.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
  ]


[tool.basedpyright]
  include                     = ["pkgs/operator-cli/src", "pkgs/operator-core/src"]
  exclude                     = ["**/__pycache__", "**/node_modules"]
  typeCheckingMode            = "recommended"
  failOnWarnings              = true
  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true

  # keep "Any" for exceptional cases
  reportExplicitAny = false
  reportAny         = false

  reportUnknownMemberType             = true
  reportUnknownParameterType          = true
  reportUnknownArgumentType           = true
  reportMissingParameterType          = true
  reportImplicitOverride              = true
  reportMissingTypeStubs              = false
  reportUnknownVariableType           = true
  reportMissingSuperCall              = false
  reportImplicitStringConcatenation   = false
  reportCallInDefaultInitializer      = true
  reportUninitializedInstanceVariable = false
  reportUnannotatedClassAttribute     = false
  reportImportCycles                  = false # you're drunk pyright go home

  # let ruff handle private usage warnings (so we exclude them on tests)
  reportPrivateUsage = false
[tool.ruff]
  fix            = false
  line-length    = 100
  src            = ["pkgs/*/src"]
  target-version = "py314"
  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    select = [
      "A",
      "ASYNC",
      "B",
      "BLE",
      "C4",
      "C90",
      "D",
      "DTZ",
      "E",
      "EM",
      "ERA",
      "F",
      "FBT",
      "FLY",
      "FURB",
      "G",
      "I",
      "ICN",
      "INP",
      "INT",
      "ISC",
      "LOG",
      "N",
      "NPY",
      "PERF",
      "PGH",
      "PIE",
      "PL",
      "PT",
      "PTH",
      "PYI",
      "Q",
      "RET",
      "RSE",
      "RUF",
      "S",
      "SIM",
      "SLF",
      "SLOT",
      "T10",
      "T20",
      "TC",
      "TID",
      "TRY",
      "UP",
      "W",
      "YTT",
    ]
    ignore = [
      "D203",
      "D213",
      "E501",
      "RET504",
      "S101",
      "S307",
      "D100",
      "D101",
      "PGH003",
    ]
    unfixable = ["ERA001", "F401", "F841", "T201", "T203"]
    [tool.ruff.lint.per-file-ignores]
      "**/objects/**.py" = [ # db stuff
        # weird default value thing for class vars, overly verbose for __mapper_args__
        "RUF012",
      ]
      "**/operator_shared/settings/**.py" = [
        # We can't put these imports under a `TYPE_CHECKING` due to Pydantic needing
        # them at runtime.
        "TC001",
        # Similarly, TC002 also exists, but we avoid putting it here to instead choose
        # wisely on one-off `noqa: ` sections, due to parts of mixed relevance.
      ]
      "**/*.test.py" = [
        # omit "invalid module name" errors
        "N999",
        # omit implicit namespace package errors
        "INP001",
        # omit private usage errors
        "SLF001",
        # omit "magic value" errors
        "PLR2004",
      ]
    [tool.ruff.lint.flake8-type-checking]
      runtime-evaluated-base-classes = [
        "pydantic.BaseModel",
        "operator_shared.forms.BaseForm",
      ]
    [tool.ruff.lint.pycodestyle]
      max-doc-length = 100
    [tool.ruff.lint.pydocstyle]
      convention = "google"
    [tool.ruff.lint.pylint]
      max-branches = 10
      max-locals   = 10

[tool.pytest.ini_options]
  addopts        = "--color=yes --doctest-modules --exitfirst --import-mode=importlib --strict-config --strict-markers --verbosity=2"
  asyncio_mode   = "auto"
  filterwarnings = ["error", "ignore::DeprecationWarning"]
  python_files   = ["*.test.py", "test_*.py"]
  testpaths      = ["pkgs/operator-core/src", "pkgs/operator-cli/src"]
  xfail_strict   = true


[tool.alembic]

  # path to migration scripts.
  # this is typically a path given in POSIX (e.g. forward slashes)
  # format, relative to the token %(here)s which refers to the location of this
  # ini file
  script_location = "%(here)s/pkgs/operator-core/src/operator_db_at2/alembic"

  # template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
  # Uncomment the line below if you want the files to be prepended with date and time
  # see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
  # for all available tokens
  # file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
  # Or organize into date-based subdirectories (requires recursive_version_locations = true)
  # file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

  # additional paths to be prepended to sys.path. defaults to the current working directory.
  prepend_sys_path = [
    ".",
  ]

  # timezone to use when rendering the date within the migration file
  # as well as the filename.
  # If specified, requires the tzdata library which can be installed by adding
  # `alembic[tz]` to the pip requirements.
  # string value is passed to ZoneInfo()
  # leave blank for localtime
  # timezone =

  # max length of characters to apply to the "slug" field
  # truncate_slug_length = 40

  # set to 'true' to run the environment during
  # the 'revision' command, regardless of autogenerate
  # revision_environment = false

  # set to 'true' to allow .pyc and .pyo files without
  # a source .py file to be detected as revisions in the
  # versions/ directory
  # sourceless = false

  # version location specification; This defaults
  # to <script_location>/versions.  When using multiple version
  # directories, initial revisions must be specified with --version-path.
  # version_locations = [
  #    "%(here)s/alembic/versions",
  #    "%(here)s/foo/bar"
  # ]


  # set to 'true' to search source files recursively
  # in each "version_locations" directory
  # new in Alembic version 1.10
  # recursive_version_locations = false

  # the output encoding used when revision files
  # are written from script.py.mako
  # output_encoding = "utf-8"

  # This section defines scripts or Python functions that are run
  # on newly generated revision scripts.  See the documentation for further
  # detail and examples
  # [[tool.alembic.post_write_hooks]]
  # format using "black" - use the console_scripts runner,
  # against the "black" entrypoint
  # name = "black"
  # type = "console_scripts"
  # entrypoint = "black"
  # options = "-l 79 REVISION_SCRIPT_FILENAME"
  #
  # [[tool.alembic.post_write_hooks]]
  # lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
  # name = "ruff"
  # type = "module"
  # module = "ruff"
  # options = "check --fix REVISION_SCRIPT_FILENAME"
  #
  # [[tool.alembic.post_write_hooks]]
  # Alternatively, use the exec runner to execute a binary found on your PATH
  # name = "ruff"
  # type = "exec"
  # executable = "ruff"
  # options = "check --fix REVISION_SCRIPT_FILENAME"
