[project]
  name = "operator"
  version = "0.1.0"
  readme = "README.md"
  requires-python = ">=3.14"
  dependencies = [
    "aiofile>=3.9.0",
    "alembic>=1.18.4",
    "anyio>=4.12.1",
    "fastnanoid>=0.4.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.49",
  ]

[tool.uv.workspace]
  members = ["pkgs/*"]

[dependency-groups]
  dev = [
    "basedpyright>=1.38.3",
    "ipython>=9.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
  ]


[tool.basedpyright]
  include                     = ["pkgs/operator-cli/src", "pkgs/operator-core/src"]
  exclude                     = ["**/__pycache__", "**/node_modules"]
  typeCheckingMode            = "recommended"
  failOnWarnings              = true
  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = false

  # keep "Any" for exceptional cases
  reportExplicitAny = false
  reportAny         = false

  reportUnknownMemberType             = true
  reportUnknownParameterType          = true
  reportUnknownArgumentType           = true
  reportMissingParameterType          = true
  reportImplicitOverride              = true
  reportMissingTypeStubs              = false
  reportUnknownVariableType           = true
  reportMissingSuperCall              = false
  reportImplicitStringConcatenation   = false
  reportCallInDefaultInitializer      = true
  reportUninitializedInstanceVariable = false

  # let ruff handle private usage warnings (so we exclude them on tests)
  reportPrivateUsage = false
[tool.ruff]
  fix            = false
  line-length    = 100
  src            = ["pkgs/*/src"]
  target-version = "py314"
  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    select = [
      "A",
      "ASYNC",
      "B",
      "BLE",
      "C4",
      "C90",
      "D",
      "DTZ",
      "E",
      "EM",
      "ERA",
      "F",
      "FBT",
      "FLY",
      "FURB",
      "G",
      "I",
      "ICN",
      "INP",
      "INT",
      "ISC",
      "LOG",
      "N",
      "NPY",
      "PERF",
      "PGH",
      "PIE",
      "PL",
      "PT",
      "PTH",
      "PYI",
      "Q",
      "RET",
      "RSE",
      "RUF",
      "S",
      "SIM",
      "SLF",
      "SLOT",
      "T10",
      "T20",
      "TC",
      "TID",
      "TRY",
      "UP",
      "W",
      "YTT",
    ]
    ignore = [
      "D203",
      "D213",
      "E501",
      "RET504",
      "S101",
      "S307",
      "D100",
      "D101",
      "PGH003",
    ]
    unfixable = ["ERA001", "F401", "F841", "T201", "T203"]
    [tool.ruff.lint.per-file-ignores]
      "**/*.test.py" = [
        # omit "invalid module name" errors
        "N999",
        # omit implicit namespace package errors
        "INP001",
        # omit private usage errors
        "SLF001",
        # omit "magic value" errors
        "PLR2004",
      ]
    [tool.ruff.lint.pycodestyle]
      max-doc-length = 100
    [tool.ruff.lint.pydocstyle]
      convention = "google"
    [tool.ruff.lint.pylint]
      max-branches = 10
      max-locals   = 10

[tool.pytest.ini_options]
  addopts        = "--color=yes --doctest-modules --exitfirst --import-mode=importlib --strict-config --strict-markers --verbosity=2"
  asyncio_mode   = "auto"
  filterwarnings = ["error", "ignore::DeprecationWarning"]
  python_files   = ["*.test.py", "test_*.py"]
  testpaths      = ["pkgs/operator-core/src", "pkgs/operator-cli/src"]
  xfail_strict   = true
