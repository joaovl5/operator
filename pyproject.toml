[project]
  name = "operator"
  version = "0.1.0"
  readme = "README.md"
  requires-python = ">=3.14"
  dependencies = [
    "aiofile>=3.9.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "anyio>=4.12.1",
    "fastnanoid>=0.4.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.49",
    "operator-core",
    "operator-cli",
    "advanced-alchemy>=1.11.0",
    "pyyaml>=6.0.3",
    "msgspec>=0.21.1",
  ]

[tool.uv.workspace]
  members = ["pkgs/*"]

[tool.uv.sources]
  operator-core = { workspace = true }
  operator-cli  = { workspace = true }

[dependency-groups]
  dev = [
    "advanced-alchemy[cli]>=1.11.0",
    "basedpyright>=1.38.3",
    "ipython>=9.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
  ]


[tool.basedpyright]
  include                     = ["pkgs/operator-cli/src", "pkgs/operator-core/src"]
  exclude                     = ["**/__pycache__", "**/node_modules"]
  typeCheckingMode            = "recommended"
  failOnWarnings              = true
  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true

  # keep "Any" for exceptional cases
  reportExplicitAny = false
  reportAny         = false

  reportMissingParameterType          = true
  reportImplicitOverride              = true
  reportArgumentType                  = false # you're stupid
  reportMissingTypeStubs              = false
  reportMissingSuperCall              = false
  reportImplicitStringConcatenation   = false
  reportCallInDefaultInitializer      = true
  reportUninitializedInstanceVariable = false
  reportUnknownParameterType          = false
  reportUnannotatedClassAttribute     = false
  reportImportCycles                  = false # you're drunk pyright go home
  reportUnusedImport                  = false # ruff already does this
  reportOptionalSubscript             = false # pyrefly is smarter
  reportOperatorIssue                 = false
  reportUnknownLambdaType             = false
  reportUnusedParameter               = false
  reportAssignmentType                = false

  # we do not care if basedpyright reports on those below, has too many false-positives
  reportAttributeAccessIssue = false
  reportUnknownArgumentType  = false
  reportUnknownMemberType    = false
  reportUnusedCallResult     = false
  reportUnknownVariableType  = false

  # let ruff handle private usage warnings (so we exclude them on tests)
  reportPrivateUsage = false
[tool.ruff]
  fix            = false
  line-length    = 70
  indent-width   = 2
  src            = ["pkgs/*/src"]
  target-version = "py314"
  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    preview = true
    extend-select = [
      "A",
      "ASYNC",
      "B",
      "BLE",
      "C4",
      "C90",
      "D",
      "DTZ",
      "E",
      "EM",
      "ERA",
      "F",
      "FBT",
      "FLY",
      "FURB",
      "G",
      "I",
      "ICN",
      "INP",
      "INT",
      "ISC",
      "LOG",
      "N",
      "NPY",
      "PERF",
      "PGH",
      "PIE",
      "PL",
      "PT",
      "PTH",
      "PYI",
      "Q",
      "RET",
      "RSE",
      "RUF",
      "S",
      "SIM",
      "SLF",
      "SLOT",
      "T10",
      "T20",
      "TC",
      "TID",
      "TRY",
      "UP",
      "W",
      "YTT",

    ]
    ignore = [
      "E114",
      "E111",
      # "D203",
      # "D213",
      # "ERA001",
      # "E501",
      # "RET504",
      # "S101",
      # "S307",
      "D100",
      "D101",
      "D105",
      "D107",
      "S101",
      # "PGH003",
      # "TID252",
    ]
    extend-safe-fixes = ["W", "E", "F"]
    # unfixable = ["ERA001", "F401", "F841", "T201", "T203"]
    [tool.ruff.lint.per-file-ignores]
      "**/objects/**.py" = [ # db stuff
        # weird default value thing for class vars, overly verbose for __mapper_args__
        "RUF012",
      ]
      "**/operator_shared/settings/**.py" = [
        # We can't put these imports under a `TYPE_CHECKING` due to Pydantic needing
        # them at runtime.
        "TC001",
        # Similarly, TC002 also exists, but we avoid putting it here to instead choose
        # wisely on one-off `noqa: ` sections, due to parts of mixed relevance.
      ]
      "**/*.test.py" = [
        # omit "invalid module name" errors
        "N999",
        # omit implicit namespace package errors
        "INP001",
        # omit private usage errors
        "SLF001",
        # omit "magic value" errors
        "PLR2004",
      ]
    [tool.ruff.lint.flake8-type-checking]
      runtime-evaluated-base-classes = [
        "pydantic.BaseModel",
        "operator_shared.forms.BaseForm",
      ]
    [tool.ruff.lint.pycodestyle]
      max-doc-length = 70
    [tool.ruff.lint.pydocstyle]
      convention = "google"
    [tool.ruff.lint.pylint]
      max-branches = 10
      max-locals   = 10

[tool.pytest.ini_options]
  addopts        = "--color=yes --doctest-modules --exitfirst --ignore=pkgs/operator-core/src/operator_db/alembic/env.py --import-mode=importlib --strict-config --strict-markers --verbosity=2"
  asyncio_mode   = "auto"
  filterwarnings = ["error", "ignore::DeprecationWarning"]
  python_files   = ["*.test.py", "test_*.py"]
  testpaths      = ["pkgs/operator-core/src", "pkgs/operator-cli/src"]
  xfail_strict   = true


[tool.alembic]
  script_location        = "%(here)s/pkgs/operator-core/src/operator_db/alembic"
  prepend_sys_path       = ["."]
  file_template          = "%%(year).2d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"
  truncate_slug_length   = 40
  version_path_separator = "os"
  output_encoding        = "utf-8"

  compare_type = true

  [[tool.alembic.post_write_hooks]]
    name       = "ruff"
    type       = "exec"
    executable = "uv"
    options    = "run ruff check --fix --unsafe-fixes --extend-fixable F401 --show-fixes REVISION_SCRIPT_FILENAME"

  [[tool.alembic.post_write_hooks]]
    name       = "ruff"
    type       = "exec"
    executable = "uv"
    options    = "run ruff format REVISION_SCRIPT_FILENAME"

[tool.pyrefly]
  project-includes = [
    "**/*.py*",
    "**/*.ipynb",
  ]
